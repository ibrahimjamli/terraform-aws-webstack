name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TF_VERSION: "1.9.8"
  TF_IN_AUTOMATION: "true"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -recursive -check -diff

  validate:
    name: Validate ${{ matrix.dir }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - modules/network
          - modules/security
          - modules/storage
          - modules/compute
          - bootstrap
          - envs/dev
          - envs/localstack
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        # -backend=false: validation needs the providers, not the state.
        run: terraform init -backend=false -input=false
        working-directory: ${{ matrix.dir }}

      - name: terraform validate
        run: terraform validate -no-color
        working-directory: ${{ matrix.dir }}

  lint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Cache the plugin directory
        uses: actions/cache@v4
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('.tflint.hcl') }}

      - name: tflint --init
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: tflint
        run: tflint --recursive --format compact --minimum-failure-severity=error

  security:
    name: Policy scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          config_file: .checkov.yml
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: false

      - name: Publish findings to the Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('checkov.sarif') != ''
        # Code scanning uploads need a public repository or GitHub Advanced
        # Security. Checkov itself already gates the build, so a private clone
        # should not go red purely over the upload.
        continue-on-error: true
        with:
          sarif_file: checkov.sarif
          category: checkov

  test:
    name: terraform test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [network, security, storage]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -input=false
        working-directory: modules/${{ matrix.module }}

      # Every run block uses command = plan, so no AWS account is involved and
      # the whole suite finishes in seconds.
      - name: terraform test
        run: terraform test -no-color
        working-directory: modules/${{ matrix.module }}

  localstack:
    name: Apply against LocalStack
    runs-on: ubuntu-latest
    needs: [fmt, validate]
    services:
      localstack:
        image: localstack/localstack:3.8
        ports:
          - 4566:4566
        env:
          SERVICES: ec2,s3,iam,sts
          DEBUG: "0"
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Wait for LocalStack to be ready
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:4566/_localstack/health > /dev/null; then
              echo "LocalStack ready after ${i} attempts"
              curl -s http://localhost:4566/_localstack/health
              exit 0
            fi
            sleep 3
          done
          echo "::error::LocalStack never became healthy"
          exit 1

      - name: terraform init
        run: terraform init -input=false
        working-directory: envs/localstack

      - name: terraform plan
        run: terraform plan -input=false -out=tfplan
        working-directory: envs/localstack

      # This is what `terraform validate` cannot do: the API calls are really
      # made, in dependency order, and the results can be read back.
      - name: terraform apply
        run: terraform apply -input=false -auto-approve tfplan
        working-directory: envs/localstack

      - name: Assert the resources actually exist
        working-directory: envs/localstack
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: eu-north-1
          AWS_ENDPOINT_URL: http://localhost:4566
        run: |
          set -euo pipefail
          vpc_id=$(terraform output -raw vpc_id)
          bucket=$(terraform output -raw data_bucket_id)

          echo "--- VPC CIDR ---"
          aws ec2 describe-vpcs --vpc-ids "$vpc_id" \
            --query 'Vpcs[0].CidrBlock' --output text | tee /dev/stderr | grep -q '10.99.0.0/16'

          echo "--- subnet count ---"
          count=$(aws ec2 describe-subnets \
            --filters "Name=vpc-id,Values=$vpc_id" \
            --query 'length(Subnets)' --output text)
          echo "subnets: $count"
          test "$count" -eq 4

          echo "--- private subnets must not auto-assign public addresses ---"
          public_on=$(aws ec2 describe-subnets \
            --filters "Name=vpc-id,Values=$vpc_id" "Name=tag:Tier,Values=private" \
            --query 'length(Subnets[?MapPublicIpOnLaunch])' --output text)
          echo "private subnets with auto-assign on: $public_on"
          test "$public_on" -eq 0

          echo "--- S3 versioning ---"
          aws s3api get-bucket-versioning --bucket "$bucket" \
            --query 'Status' --output text | tee /dev/stderr | grep -q Enabled

          echo "--- S3 public access block ---"
          aws s3api get-public-access-block --bucket "$bucket" \
            --query 'PublicAccessBlockConfiguration.BlockPublicAcls' --output text \
            | tee /dev/stderr | grep -qi true

          echo "All assertions passed against a real API."

      # A second plan over unchanged code must be empty. A configuration that
      # always shows a diff is recreating something on every single run.
      - name: Assert the plan is idempotent
        working-directory: envs/localstack
        run: |
          terraform plan -input=false -detailed-exitcode && code=0 || code=$?
          if [ "$code" -eq 2 ]; then
            echo "::error::Re-planning unchanged configuration produced a diff"
            exit 1
          fi
          exit "$code"

      - name: terraform destroy
        if: always()
        run: terraform destroy -input=false -auto-approve
        working-directory: envs/localstack
